<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>ACEX · Mantención Preventiva</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#F5F7FA; --s1:#FFFFFF; --s2:#EBF0F7; --s3:#D8E2EE;
  --border:#D8E2EE; --border2:#B8CAE0;
  --text:#1A1F2B; --muted:#637181; --faint:#9BAAB8;
  --green:#007140; --greenl:#00A35E; --greenbg:#E6F4EC; --lime:#78be20;
  --blue:#1D6FD1; --bluel:#4A96E8; --bluebg:#EBF3FD;
  --amber:#C96D00; --amberl:#E08300; --amberbg:#FEF3E2;
  --red:#C0392B; --redl:#D94432; --redbg:#FEECEB;
  --teal:#0D7377; --teall:#129B9F; --tealbg:#E5F4F5;
  --r:12px; --rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:120px}

/* TOPBAR */
.topbar{background:#1D6FD1;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo-block{display:flex;align-items:center;gap:10px}
.logo-txt{font-size:13px;font-weight:700;color:#fff;letter-spacing:.3px}
.logo-divider{width:1px;height:16px;background:rgba(255,255,255,.4)}
.logo-sub{font-size:11px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.5px}
.topbar-title{font-size:12px;color:rgba(255,255,255,.8);font-weight:600}

/* SECTIONS */
.section{margin:16px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 4px rgba(29,111,209,.06)}
.section-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.section-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.section-title{font-size:14px;font-weight:700}
.section-sub{font-size:11px;color:var(--muted);margin-top:1px}
.section-body{padding:16px}

/* FORM */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg:last-child{margin-bottom:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.req::after{content:' *';color:var(--red)}
input,select,textarea{background:var(--s2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;padding:12px 13px;width:100%;outline:none;-webkit-appearance:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,111,209,.12)}
input[readonly]{background:var(--s3);color:var(--muted)}
input::placeholder,textarea::placeholder{color:var(--faint)}
select option{background:var(--s1)}
textarea{resize:none;min-height:80px;line-height:1.5}

/* TICKET BADGE */
.ticket-badge{display:inline-flex;align-items:center;gap:6px;background:var(--tealbg);border:1px solid var(--teal);border-radius:20px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--teal);margin-bottom:16px}

/* CARGADOR CARD */
.cargadores-list{display:flex;flex-direction:column;gap:12px}
.cargador-card{background:var(--s2);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;transition:border-color .2s}
.cargador-card.no-aplica-card{opacity:.5}
.cargador-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--s3);border-bottom:1px solid var(--border)}
.cargador-num{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.cargador-num-badge{width:26px;height:26px;border-radius:6px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace}
.no-aplica-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.no-aplica-toggle input[type=checkbox]{display:none}
.toggle-pill{width:38px;height:20px;background:var(--border2);border-radius:10px;position:relative;transition:background .2s;flex-shrink:0}
.toggle-pill::after{content:'';width:16px;height:16px;border-radius:8px;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.no-aplica-toggle input:checked ~ .toggle-pill{background:var(--amber)}
.no-aplica-toggle input:checked ~ .toggle-pill::after{left:20px}
.toggle-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.cargador-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}

/* SN INPUT inline */
.sn-row{display:flex;align-items:center;gap:8px}
.sn-label{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;letter-spacing:.2px;min-width:24px}
.sn-input{background:var(--s1);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);outline:none;flex:1;transition:border-color .15s}
.sn-input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(29,111,209,.1)}

/* CHECKS GRID */
.checks-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.check-item{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--border);border-radius:6px;padding:8px 10px;cursor:pointer;user-select:none;transition:border-color .15s,background .15s}
.check-item:active{background:var(--greenbg)}
.check-item input[type=checkbox]{display:none}
.check-box{width:18px;height:18px;border-radius:4px;border:2px solid var(--border2);background:var(--s2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.check-item input:checked ~ .check-box{border-color:var(--green);background:var(--green)}
.check-item input:checked ~ .check-box::after{content:'✓';color:#fff;font-size:11px;font-weight:700}
.check-item input:checked ~ .check-lbl{color:var(--green);font-weight:600}
.check-lbl{font-size:12px;color:var(--muted);line-height:1.2}

/* OBSERVACIONES TOGGLE */
.obs-toggle{font-size:11px;font-weight:600;color:var(--blue);cursor:pointer;display:flex;align-items:center;gap:4px;padding:2px 0}
.obs-toggle::before{content:'+ '}
.obs-toggle.open::before{content:'− '}
.obs-textarea{display:none;margin-top:6px}
.obs-textarea.show{display:block}

/* CORRECTIVO BADGE en tarjeta */
.correctivo-indicator{display:none;font-size:11px;font-weight:700;color:var(--amber);background:var(--amberbg);border:1px solid var(--amberl);border-radius:20px;padding:3px 8px}
.correctivo-indicator.show{display:inline-flex;align-items:center;gap:4px}

/* FOTOS POR CARGADOR */
.foto-section{margin-top:8px}
.foto-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.foto-hdr-lbl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.2px;display:flex;align-items:center;gap:5px}
.foto-cnt-badge{font-size:10px;font-weight:700;color:#fff;background:var(--blue);border-radius:10px;padding:1px 6px}
.btn-add-foto{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--blue);background:var(--bluebg);border:1px solid var(--blue);border-radius:6px;padding:5px 10px;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.btn-add-foto:active{opacity:.7}
.foto-strip{display:flex;flex-wrap:wrap;gap:6px;min-height:0}
.foto-thumb{position:relative;width:72px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--border);flex-shrink:0}
.foto-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.foto-thumb-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}

/* DISABLED state */
.cargador-card.no-aplica-card .cargador-body{pointer-events:none}
.cargador-card.no-aplica-card .checks-grid{opacity:.4}
.cargador-card.no-aplica-card .sn-input{opacity:.4}

/* SUBMIT */
.submit-section{position:fixed;bottom:0;left:0;right:0;padding:16px;background:rgba(245,247,250,.96);backdrop-filter:blur(8px);border-top:1px solid var(--border);z-index:50}
.btn-submit{width:100%;padding:16px;background:linear-gradient(135deg,var(--teal),var(--blue));border:none;border-radius:var(--rs);color:#fff;font-family:'Inter',sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
.btn-submit:active{opacity:.85}
.btn-submit:disabled{background:var(--border2);cursor:not-allowed;opacity:.6}

/* SUCCESS STATE */
#success-state{display:none;margin:16px}
#success-state.show{display:block}
.success-card{background:var(--greenbg);border:1.5px solid var(--green);border-radius:var(--r);padding:24px;text-align:center}
.success-icon{font-size:40px;margin-bottom:12px}
.success-title{font-size:18px;font-weight:700;color:var(--green);margin-bottom:6px}
.success-sub{font-size:13px;color:var(--text);margin-bottom:20px;line-height:1.5}
.btn-pdf{width:100%;padding:14px;background:var(--blue);border:none;border-radius:var(--rs);color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.btn-nuevo{width:100%;padding:13px;background:transparent;border:1.5px solid var(--green);border-radius:var(--rs);color:var(--green);font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer}

/* LOADING OVERLAY */
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(245,247,250,.9);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--muted);font-weight:500}

/* ── PRINT ── */
@media print {
  body{background:#fff;padding:0}
  .topbar,.submit-section,#success-state,.obs-toggle{display:none!important}
  .section{margin:0 0 16px;box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .cargador-card{break-inside:avoid}
  .print-header{display:block!important}
  .obs-textarea{display:block!important}
  .cargador-card.no-aplica-card .cargador-body{pointer-events:auto}
  .cargador-card.no-aplica-card .checks-grid{opacity:1}
  .check-item input:checked ~ .check-box{border-color:#007140;background:#007140;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cargador-num-badge{background:#1D6FD1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .foto-strip{display:flex!important;flex-wrap:wrap;gap:4px}
  .foto-thumb{width:80px;height:80px;break-inside:avoid}
  .foto-thumb img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .foto-thumb-del,.btn-add-foto,.foto-hdr-lbl{display:none!important}
  .foto-cnt-badge{display:none!important}
  .foto-section:has(.foto-thumb) .foto-hdr-lbl{display:flex!important}
}
.print-header{display:none;text-align:center;padding:16px 0 8px;border-bottom:2px solid #1D6FD1;margin-bottom:16px}
.print-header h1{font-size:18px;font-weight:700;color:#1D6FD1}
.print-header p{font-size:12px;color:#637181;margin-top:4px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo-block">
    <span class="logo-txt">enel</span>
    <div class="logo-divider"></div>
    <span class="logo-sub">ACEX</span>
  </div>
  <span class="topbar-title">Mantención Preventiva</span>
</div>

<!-- PRINT HEADER (solo visible al imprimir) -->
<div class="print-header">
  <h1>ACEX · Registro de Mantención Preventiva</h1>
  <p id="print-meta"></p>
</div>

<!-- SECCIÓN 1: DATOS DE LA VISITA -->
<div class="section" id="sec-datos">
  <div class="section-hdr">
    <div class="section-icon" style="background:#EBF3FD">🗓️</div>
    <div>
      <div class="section-title">Datos de la visita</div>
      <div class="section-sub">Terminal, técnico y fecha de mantención</div>
    </div>
  </div>
  <div class="section-body">
    <div class="fg">
      <label class="req">Cliente</label>
      <select id="sel-cliente" onchange="onClienteChange()">
        <option value="">— Selecciona cliente —</option>
      </select>
    </div>
    <div class="fg">
      <label class="req">Terminal</label>
      <select id="sel-terminal" disabled onchange="onTerminalChange()">
        <option value="">— Selecciona cliente primero —</option>
      </select>
    </div>
    <div class="row2">
      <div class="fg">
        <label>N° Cargadores</label>
        <input type="text" id="info-cargadores" readonly placeholder="—"/>
      </div>
      <div class="fg">
        <label class="req">Técnico</label>
        <select id="sel-tecnico">
          <option value="">— Técnico —</option>
          <optgroup label="Operadores ACEX">
            <option>Victor Torres</option>
            <option>Sebastian Seron</option>
            <option>Cristian Droguett</option>
            <option>Sara Ganga</option>
            <option>Cesar Soto</option>
            <option>Emilio Cardenas</option>
            <option>Nikkolas Eterrovic</option>
          </optgroup>
          <optgroup label="Contratistas">
            <option>Rodrigo Jerez (SOLGELEC)</option>
            <option>Eddic Monzart (SOLGELEC)</option>
            <option>Daniel Contreras (DCC)</option>
            <option>Rafael García (RAICA)</option>
            <option>Fernando Morales (LARI)</option>
            <option>Jonathan Salgado (SOLGEC)</option>
            <option>Carlos Bozzo (AINEL)</option>
          </optgroup>
        </select>
      </div>
    </div>
    <div class="fg">
      <label class="req">Fecha de visita</label>
      <input type="date" id="inp-fecha"/>
    </div>
    <div class="fg">
      <label>Observaciones generales de la visita</label>
      <textarea id="obs-generales" placeholder="Condiciones del sitio, coordinación con jefe de patio, observaciones adicionales…"></textarea>
    </div>
  </div>
</div>

<!-- SECCIÓN 2: CHECKLIST CARGADORES -->
<div class="section" id="sec-checklist" style="display:none">
  <div class="section-hdr">
    <div class="section-icon" style="background:#E5F4F5">⚡</div>
    <div>
      <div class="section-title">Checklist por cargador</div>
      <div class="section-sub" id="checklist-sub">Marca los ítems completados por cada cargador</div>
    </div>
  </div>
  <div class="section-body">
    <div class="cargadores-list" id="cargadores-list"></div>
  </div>
</div>

<!-- SUCCESS -->
<div id="success-state">
  <div class="success-card">
    <div class="success-icon">✅</div>
    <div class="success-title">Mantención registrada</div>
    <div class="success-sub" id="success-msg">El registro fue guardado en Airtable.</div>
    <button class="btn-pdf" onclick="generarPDF()">🖨️ Descargar / Imprimir PDF</button>
    <button class="btn-nuevo" onclick="location.reload()">+ Nueva mantención</button>
  </div>
</div>

<!-- SUBMIT -->
<div class="submit-section" id="submit-bar">
  <button class="btn-submit" id="btn-submit" onclick="enviarMantencion()">
    💾 Guardar registro de mantención
  </button>
</div>

<!-- LOADING -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-txt">Guardando en Airtable…</div>
</div>

<script>
// ─── DB (igual que index.html — se reemplazará con datos reales de tablas maestras) ───
const DB = {
  clientes: [
    { id:'CL001', nombre:'RBU' },
    { id:'CL002', nombre:'METBUS' },
    { id:'CL003', nombre:'VOY SANTIAGO SPA' },
    { id:'CL004', nombre:'VOY SANTIAGO 14' },
    { id:'CL005', nombre:'VOY SANTIAGO 15' },
    { id:'CL006', nombre:'TRANSPORTES ALEJANDRO IBAÑEZ' },
    { id:'CL007', nombre:'CORP. MUNICIPAL COLINA' },
    { id:'CL008', nombre:'ESERCO' },
    { id:'CL009', nombre:'EXPRESO RANCAGUA' },
    { id:'CL010', nombre:'YANGUAS' },
    { id:'CL011', nombre:'EFRABUS' },
    { id:'CL012', nombre:'GALAXIAS SUSTENTABLE' },
    { id:'CL013', nombre:'OK BUSES' },
  ],
  terminales: {
    CL001: [
      { id:'T001', nombre:'Terminal Pudahuel Norte', ubic:'Av. El Colorado 1240, Pudahuel', cargadores:12 },
      { id:'T002', nombre:'Terminal Lo Espejo',      ubic:'Av. Central 890, Lo Espejo',    cargadores:8 },
    ],
    CL002: [
      { id:'T003', nombre:'Terminal Maipú',          ubic:'Av. Rinconada 1500, Maipú',     cargadores:16 },
      { id:'T004', nombre:'Terminal Quilicura',       ubic:'Av. Matta 2300, Quilicura',     cargadores:10 },
    ],
    CL003: [
      { id:'T005', nombre:'ET La Estrella',           ubic:'Cerro Navia',                  cargadores:13 },
    ],
    CL010: [
      { id:'T006', nombre:'ET Los Almendros (Pudahuel)', ubic:'Av. José Guzmán Riesco 1343, Pudahuel', cargadores:13 },
    ],
    CL011: [
      { id:'T007', nombre:'Terminal Horcón',          ubic:'Horcón, V Región',             cargadores:6 },
    ],
    CL013: [
      { id:'T008', nombre:'Terminal Colina',          ubic:'Colina, RM',                   cargadores:8 },
    ],
  }
};

const CHECKLIST_ITEMS = [
  { id:'limpieza',   label:'Limpieza de equipo' },
  { id:'reapriete',  label:'Reapriete de conexiones' },
  { id:'filtro',     label:'Limpieza de filtro' },
  { id:'tension',    label:'Verificación de tensión' },
  { id:'sello',      label:'Instalación de sello' },
  { id:'carga',      label:'Prueba de carga' },
];

const BASE_URL = 'https://app.acex.cl';

// ─── ESTADO ───
let S = { clienteId:'', terminal:null, tecnico:'', fecha:'', cargadores:[] };

// ─── INIT ───
document.addEventListener('DOMContentLoaded', () => {
  // Fecha hoy por defecto
  document.getElementById('inp-fecha').value = new Date().toISOString().split('T')[0];
  // Poblar clientes
  const sel = document.getElementById('sel-cliente');
  DB.clientes.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.nombre;
    sel.appendChild(o);
  });
});

function onClienteChange() {
  const cid = document.getElementById('sel-cliente').value;
  S.clienteId = cid;
  S.terminal = null;
  const selT = document.getElementById('sel-terminal');
  selT.innerHTML = '<option value="">— Selecciona terminal —</option>';
  selT.disabled = !cid;
  document.getElementById('info-cargadores').value = '';
  document.getElementById('sec-checklist').style.display = 'none';
  if (!cid) return;
  const terms = DB.terminales[cid] || [];
  if (!terms.length) {
    selT.innerHTML = '<option value="">Sin terminales registrados</option>';
    return;
  }
  terms.forEach(t => {
    const o = document.createElement('option');
    o.value = t.id; o.textContent = t.nombre;
    selT.appendChild(o);
  });
}

function onTerminalChange() {
  const cid = document.getElementById('sel-cliente').value;
  const tid = document.getElementById('sel-terminal').value;
  if (!tid) { document.getElementById('sec-checklist').style.display='none'; return; }
  const terms = DB.terminales[cid] || [];
  S.terminal = terms.find(t => t.id === tid) || null;
  if (!S.terminal) return;
  document.getElementById('info-cargadores').value = S.terminal.cargadores;
  document.getElementById('checklist-sub').textContent =
    `${S.terminal.nombre} · ${S.terminal.cargadores} cargadores`;
  generarCargadores(S.terminal.cargadores);
  document.getElementById('sec-checklist').style.display = 'block';
  setTimeout(() => document.getElementById('sec-checklist').scrollIntoView({behavior:'smooth',block:'start'}), 100);
}

function generarCargadores(n) {
  const list = document.getElementById('cargadores-list');
  list.innerHTML = '';
  S.cargadores = [];
  for (let i = 1; i <= n; i++) {
    S.cargadores.push({ num:i, sn:'', noAplica:false, checks:{}, observaciones:'', fotos:[] });
    list.appendChild(crearCargadorCard(i));
  }
}

function crearCargadorCard(num) {
  const card = document.createElement('div');
  card.className = 'cargador-card';
  card.id = `card-${num}`;

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'cargador-hdr';
  hdr.innerHTML = `
    <div class="cargador-num">
      <div class="cargador-num-badge">${num}</div>
      Cargador ${num}
      <span class="correctivo-indicator" id="ci-${num}">⚠️ Correctivo</span>
    </div>
    <label class="no-aplica-toggle" onclick="toggleNoAplica(${num}, this)">
      <input type="checkbox" id="na-${num}"/>
      <div class="toggle-pill"></div>
      <span class="toggle-label">NO APLICA</span>
    </label>
  `;
  card.appendChild(hdr);

  // Body
  const body = document.createElement('div');
  body.className = 'cargador-body';
  body.id = `body-${num}`;

  // S/N
  body.innerHTML += `
    <div class="sn-row">
      <span class="sn-label">S/N</span>
      <input class="sn-input" type="text" id="sn-${num}" placeholder="Número de serie (opcional)"
        oninput="S.cargadores[${num-1}].sn=this.value"/>
    </div>
  `;

  // Checklist grid
  const grid = document.createElement('div');
  grid.className = 'checks-grid';
  CHECKLIST_ITEMS.forEach(item => {
    const lbl = document.createElement('label');
    lbl.className = 'check-item';
    lbl.innerHTML = `
      <input type="checkbox" id="chk-${num}-${item.id}"
        onchange="onCheck(${num},'${item.id}',this.checked)"/>
      <div class="check-box"></div>
      <span class="check-lbl">${item.label}</span>
    `;
    grid.appendChild(lbl);
  });
  body.appendChild(grid);

  // Observaciones / correctivos
  body.innerHTML += `
    <div>
      <div class="obs-toggle" id="obstog-${num}" onclick="toggleObs(${num})">
        Observaciones / correctivo requerido
      </div>
      <div class="obs-textarea" id="obsbox-${num}">
        <textarea id="obs-${num}" placeholder="Ej: requiere cambio de módulo de potencia, conector CCS2 dañado, toma deteriorada…"
          oninput="onObs(${num},this.value)" style="margin-top:6px"></textarea>
      </div>
    </div>
  `;

  // Fotos
  const fotoSection = document.createElement('div');
  fotoSection.className = 'foto-section';
  fotoSection.id = `foto-sec-${num}`;
  fotoSection.innerHTML = `
    <div class="foto-hdr">
      <span class="foto-hdr-lbl">
        📷 Fotos
        <span class="foto-cnt-badge" id="foto-cnt-${num}" style="display:none">0</span>
      </span>
      <label class="btn-add-foto" for="foto-inp-${num}">📷 Agregar foto</label>
      <input type="file" id="foto-inp-${num}" accept="image/*" capture="environment"
        style="display:none" onchange="addFoto(${num},this)"/>
    </div>
    <div class="foto-strip" id="foto-strip-${num}"></div>
  `;
  body.appendChild(fotoSection);

  card.appendChild(body);
  return card;
}

function toggleNoAplica(num, lbl) {
  // El click ya maneja el checkbox nativo; leemos su estado en el próximo tick
  setTimeout(() => {
    const checked = document.getElementById(`na-${num}`).checked;
    S.cargadores[num-1].noAplica = checked;
    const card = document.getElementById(`card-${num}`);
    card.classList.toggle('no-aplica-card', checked);
  }, 0);
}

function onCheck(num, itemId, checked) {
  S.cargadores[num-1].checks[itemId] = checked;
}

function onObs(num, val) {
  S.cargadores[num-1].observaciones = val;
  // Mostrar badge si hay texto
  const ci = document.getElementById(`ci-${num}`);
  ci.classList.toggle('show', val.trim().length > 0);
}

function toggleObs(num) {
  const box = document.getElementById(`obsbox-${num}`);
  const tog = document.getElementById(`obstog-${num}`);
  box.classList.toggle('show');
  tog.classList.toggle('open');
}

// ─── FOTOS ───
const MAX_FOTOS = 4;

function addFoto(num, input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  const cargador = S.cargadores[num - 1];
  const remaining = MAX_FOTOS - cargador.fotos.length;
  files.slice(0, remaining).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      cargador.fotos.push(e.target.result);
      renderFotos(num);
    };
    reader.readAsDataURL(file);
  });
  input.value = ''; // reset so same photo can be re-captured if needed
}

function removeFoto(num, idx) {
  S.cargadores[num - 1].fotos.splice(idx, 1);
  renderFotos(num);
}

function renderFotos(num) {
  const fotos  = S.cargadores[num - 1].fotos;
  const strip  = document.getElementById(`foto-strip-${num}`);
  const cntEl  = document.getElementById(`foto-cnt-${num}`);
  const addLbl = document.querySelector(`label[for="foto-inp-${num}"]`);

  strip.innerHTML = fotos.map((src, i) => `
    <div class="foto-thumb">
      <img src="${src}" alt="Foto ${i + 1}"/>
      <button class="foto-thumb-del" type="button" onclick="removeFoto(${num},${i})">×</button>
    </div>
  `).join('');

  cntEl.textContent = fotos.length;
  cntEl.style.display = fotos.length ? 'inline' : 'none';
  if (addLbl) addLbl.style.display = fotos.length >= MAX_FOTOS ? 'none' : 'inline-flex';
}

// ─── GENERAR TICKET ───
function generarTicket() {
  const d = new Date();
  const fecha = d.toISOString().slice(0,10).replace(/-/g,'');
  const rnd = String(Math.floor(Math.random()*900)+100);
  return `MNT-${fecha}-${rnd}`;
}

// ─── VALIDAR ───
function validar() {
  if (!document.getElementById('sel-cliente').value) return 'Selecciona un cliente';
  if (!document.getElementById('sel-terminal').value) return 'Selecciona un terminal';
  if (!document.getElementById('sel-tecnico').value)  return 'Selecciona un técnico';
  if (!document.getElementById('inp-fecha').value)    return 'Ingresa la fecha de visita';
  return null;
}

// ─── ENVIAR ───
async function enviarMantencion() {
  const err = validar();
  if (err) { alert(err); return; }

  const ticket   = generarTicket();
  const tecnico  = document.getElementById('sel-tecnico').value;
  const fecha    = document.getElementById('inp-fecha').value;
  const obsGen   = document.getElementById('obs-generales').value;
  const tieneCorrectivos = S.cargadores.some(c => c.observaciones?.trim());

  // Snapshot de datos de cargadores
  const cargadoresData = S.cargadores.map(c => ({
    num:           c.num,
    sn:            document.getElementById(`sn-${c.num}`)?.value || '',
    noAplica:      document.getElementById(`na-${c.num}`)?.checked || false,
    limpieza:      document.getElementById(`chk-${c.num}-limpieza`)?.checked || false,
    reapriete:     document.getElementById(`chk-${c.num}-reapriete`)?.checked || false,
    filtro:        document.getElementById(`chk-${c.num}-filtro`)?.checked || false,
    tension:       document.getElementById(`chk-${c.num}-tension`)?.checked || false,
    sello:         document.getElementById(`chk-${c.num}-sello`)?.checked || false,
    carga:         document.getElementById(`chk-${c.num}-carga`)?.checked || false,
    observaciones: document.getElementById(`obs-${c.num}`)?.value || '',
    fotos_count:   c.fotos.length,
  }));

  const payload = {
    ticket,
    terminal:            S.terminal.nombre,
    terminalId:          S.terminal.id,
    cliente:             DB.clientes.find(c => c.id === S.clienteId)?.nombre || '',
    clienteId:           S.clienteId,
    fecha,
    tecnico,
    cargadoresJson:      JSON.stringify(cargadoresData),
    observacionesGen:    obsGen,
    tieneCorrectivos,
  };

  // Actualizar print meta
  document.getElementById('print-meta').textContent =
    `${ticket} · ${S.terminal.nombre} · ${tecnico} · ${fecha}`;

  document.getElementById('loading').classList.add('show');
  document.getElementById('btn-submit').disabled = true;

  try {
    const resp = await fetch(`${BASE_URL}/.netlify/functions/guardar-mantencion`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Error al guardar');

    document.getElementById('loading').classList.remove('show');
    document.getElementById('sec-datos').style.display = 'none';
    document.getElementById('sec-checklist').style.display = 'none';
    document.getElementById('submit-bar').style.display = 'none';
    document.getElementById('success-msg').textContent =
      `Ticket ${ticket} guardado correctamente en Airtable.${tieneCorrectivos ? ' ⚠️ Hay correctivos pendientes.' : ''}`;
    document.getElementById('success-state').classList.add('show');
    window.scrollTo({top:0,behavior:'smooth'});

  } catch(e) {
    document.getElementById('loading').classList.remove('show');
    document.getElementById('btn-submit').disabled = false;
    alert('Error al guardar: ' + e.message);
  }
}

function generarPDF() {
  // Mostrar todas las obs antes de imprimir
  document.querySelectorAll('.obs-textarea').forEach(el => el.classList.add('show'));
  window.print();
}
</script>
