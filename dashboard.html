<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ACEX · Dashboard Supervisor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* Forzar tema claro — panel operacional */
:root {
  --bg:        #F5F7FA;
  --s1:        #FFFFFF;
  --s2:        #EBF0F7;
  --border:    #D8E2EE;
  --border2:   #B8CAE0;
  --text:      #1A1F2B;
  --muted:     #637181;
  --faint:     #9BAAB8;
  --blue:      #1D6FD1;
  --blue-dk:   #1558A8;
  --blue-bg:   #EBF3FD;
  --blue-bdr:  #B3D4F5;
  --green:     #007140;
  --green-bg:  #E6F4EC;
  --green-bdr: #99D4B4;
  --amber:     #C96D00;
  --amber-bg:  #FEF3E2;
  --amber-bdr: #FABB67;
  --red:       #C0392B;
  --red-bg:    #FEECEB;
  --red-bdr:   #F0A09A;
  --teal:      #0D7377;
  --teal-bg:   #E5F4F5;
  --r:         10px;
  --rs:        6px;
  color-scheme: light;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}

/* ── TOPBAR ── */
.topbar{background:#1D6FD1;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo-block{display:flex;align-items:center;gap:10px}
.logo-txt{font-size:13px;font-weight:700;color:#fff;letter-spacing:.3px}
.logo-div{width:1px;height:16px;background:rgba(255,255,255,.4)}
.logo-sub{font-size:11px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.5px}
.topbar-right{display:flex;align-items:center;gap:12px}
.live{display:flex;align-items:center;gap:5px;font-size:11px;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.85)}
.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#78be20;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.btn-refresh{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#fff;font-size:12px;font-weight:600;padding:5px 12px;cursor:pointer;transition:background .15s;font-family:'Inter',sans-serif}
.btn-refresh:hover{background:rgba(255,255,255,.22)}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 52px);padding:24px}
.login-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:36px 32px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(29,111,209,.08)}
.login-logo{font-size:22px;font-weight:700;color:var(--blue);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
.login-label{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;display:block;letter-spacing:.3px}
.login-input{width:100%;border:1.5px solid var(--border);border-radius:var(--rs);padding:10px 14px;font-size:15px;font-family:'JetBrains Mono',monospace;letter-spacing:3px;outline:none;transition:border .15s;background:#fff;color:var(--text)}
.login-input:focus{border-color:var(--blue)}
.login-error{font-size:12px;color:var(--red);margin-top:8px;min-height:16px}
.btn-login{width:100%;margin-top:20px;background:#007140;border:none;border-radius:var(--rs);color:#fff;font-size:14px;font-weight:700;padding:12px;cursor:pointer;transition:background .15s;font-family:'Inter',sans-serif}
.btn-login:hover{background:#005C33}

/* ── MAIN LAYOUT ── */
#main-screen{display:none;padding:24px}

/* ── KPIs ── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px}
.kpi-val{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text);line-height:1}
.kpi-lbl{font-size:11px;font-weight:600;color:var(--muted);margin-top:6px;letter-spacing:.5px;text-transform:uppercase}
.kpi.blue .kpi-val{color:var(--blue)}
.kpi.green .kpi-val{color:var(--green)}
.kpi.amber .kpi-val{color:var(--amber)}
.kpi.red .kpi-val{color:var(--red)}

/* ── FILTROS ── */
.filtros{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filtros label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.filtros select,.filtros input{border:1.5px solid var(--border);border-radius:var(--rs);padding:6px 10px;font-size:13px;font-family:'Inter',sans-serif;color:var(--text);background:#fff;outline:none;transition:border .15s}
.filtros select:focus,.filtros input:focus{border-color:var(--blue)}
.filtros input[type="date"]{font-family:'JetBrains Mono',monospace;font-size:12px}
.filtro-group{display:flex;align-items:center;gap:7px}
.btn-filtrar{background:var(--blue);border:none;border-radius:var(--rs);color:#fff;font-size:12px;font-weight:700;padding:7px 16px;cursor:pointer;transition:background .15s;font-family:'Inter',sans-serif}
.btn-filtrar:hover{background:var(--blue-dk)}
.btn-limpiar{background:none;border:1.5px solid var(--border);border-radius:var(--rs);color:var(--muted);font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.btn-limpiar:hover{border-color:var(--border2);color:var(--text)}
.n-resultados{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-left:auto}

/* ── TABLA ── */
.tabla-wrap{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.tabla-head{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tabla-title{font-size:13px;font-weight:700;color:var(--text)}
.tabla-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
thead tr{background:var(--bg)}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.td-ticket{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--blue);font-size:12px;white-space:nowrap}
.td-cliente{font-weight:600;color:var(--text)}
.td-terminal{color:var(--muted);font-size:12px}
.td-falla{color:var(--text);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-fecha{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap}
.td-hh{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--teal);text-align:right}

/* badges */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.badge-abierto{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bdr)}
.badge-terreno{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bdr)}
.badge-pendiente{background:#F3F0FF;color:#5B4DC8;border:1px solid #C4B8F5}
.badge-cerrado{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bdr)}
.badge-cancelado{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bdr)}

.badge-gar-vigente{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bdr)}
.badge-gar-fuera{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bdr)}
.badge-gar-sin{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bdr)}

/* acciones */
.td-acciones{white-space:nowrap}
.btn-accion{display:inline-block;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700;text-decoration:none;transition:opacity .15s;border:none;cursor:pointer;font-family:'Inter',sans-serif}
.btn-accion:hover{opacity:.75}
.btn-terreno{background:var(--amber-bg);color:var(--amber)}
.btn-aprobacion{background:#F3F0FF;color:#5B4DC8}
.btn-reporte{background:var(--blue-bg);color:var(--blue)}

/* estado vacío / carga */
.estado-tabla{padding:48px;text-align:center;color:var(--muted);font-size:13px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* timestamp */
.last-update{font-size:11px;color:var(--faint);font-family:'JetBrains Mono',monospace;text-align:right;margin-top:12px}

/* modal detalle */
.overlay{position:fixed;inset:0;background:rgba(26,31,43,.45);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.15)}
.modal-hdr{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:700;color:var(--text)}
.modal-ticket{font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--blue);font-weight:600}
.btn-close{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:2px 6px}
.btn-close:hover{color:var(--text)}
.modal-body{padding:20px 22px;display:grid;gap:10px}
.mrow{display:flex;gap:8px;font-size:13px}
.mk{color:var(--muted);font-weight:500;min-width:110px;flex-shrink:0}
.mv{color:var(--text);font-weight:500;word-break:break-word}
.modal-links{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.btn-modal{flex:1;min-width:130px;padding:10px 14px;border-radius:var(--rs);font-size:13px;font-weight:700;text-align:center;text-decoration:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .15s}
.btn-modal:hover{opacity:.8}
.bm-terreno{background:var(--amber-bg);color:var(--amber)}
.bm-aprobacion{background:#F3F0FF;color:#5B4DC8}
.bm-reporte{background:var(--blue-bg);color:var(--blue)}

@media(max-width:600px){
  #main-screen{padding:14px}
  .kpi-row{grid-template-columns:1fr 1fr}
  .filtros{gap:8px}
  .topbar{padding:0 14px}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo-block">
    <span class="logo-txt">enel</span>
    <div class="logo-div"></div>
    <span class="logo-sub">ACEX</span>
  </div>
  <div class="topbar-right">
    <span class="live" id="live-ind" style="display:none">Sistema activo</span>
    <button class="btn-refresh" onclick="cargarDatos()" id="btn-ref" style="display:none">↻ Actualizar</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Dashboard</div>
    <div class="login-sub">Panel supervisor · ACEX Electroterminales</div>
    <label class="login-label">PIN de acceso</label>
    <input class="login-input" id="pin-input" type="password" maxlength="12" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')login()"/>
    <div class="login-error" id="login-error"></div>
    <button class="btn-login" onclick="login()">Ingresar</button>
  </div>
</div>

<!-- MAIN -->
<div id="main-screen">

  <!-- KPIs -->
  <div class="kpi-row">
    <div class="kpi blue"><div class="kpi-val" id="k-total">—</div><div class="kpi-lbl">Total casos</div></div>
    <div class="kpi amber"><div class="kpi-val" id="k-terreno">—</div><div class="kpi-lbl">En terreno</div></div>
    <div class="kpi" style="--kpi-c:#5B4DC8"><div class="kpi-val" id="k-pendiente" style="color:#5B4DC8">—</div><div class="kpi-lbl">Pend. aprobación</div></div>
    <div class="kpi green"><div class="kpi-val" id="k-cerrado">—</div><div class="kpi-lbl">Cerrados</div></div>
    <div class="kpi"><div class="kpi-val" id="k-hh" style="color:var(--teal)">—</div><div class="kpi-lbl">HH prom. respuesta</div></div>
  </div>

  <!-- FILTROS -->
  <div class="filtros">
    <div class="filtro-group">
      <label>Estado</label>
      <select id="f-estado">
        <option value="todos">Todos</option>
        <option value="Abierto">Abierto</option>
        <option value="En terreno">En terreno</option>
        <option value="Pendiente aprobación">Pend. aprobación</option>
        <option value="Cerrado">Cerrado</option>
        <option value="Cancelado">Cancelado</option>
      </select>
    </div>
    <div class="filtro-group">
      <label>Cliente</label>
      <input id="f-cliente" type="text" placeholder="Buscar cliente…" style="width:180px"/>
    </div>
    <div class="filtro-group">
      <label>Desde</label>
      <input id="f-desde" type="date"/>
    </div>
    <div class="filtro-group">
      <label>Hasta</label>
      <input id="f-hasta" type="date"/>
    </div>
    <button class="btn-filtrar" onclick="aplicarFiltros()">Filtrar</button>
    <button class="btn-limpiar" onclick="limpiarFiltros()">Limpiar</button>
    <span class="n-resultados" id="n-resultados"></span>
  </div>

  <!-- TABLA -->
  <div class="tabla-wrap">
    <div class="tabla-scroll">
      <table>
        <thead>
          <tr>
            <th>Ticket</th>
            <th>Estado</th>
            <th>Cliente</th>
            <th>Terminal</th>
            <th>Falla</th>
            <th>Garantía</th>
            <th>Técnico</th>
            <th>Apertura</th>
            <th>HH</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr><td colspan="10" class="estado-tabla">
            <div class="spinner"></div>Cargando casos…
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="last-update" id="last-update"></div>
</div>

<!-- MODAL DETALLE -->
<div class="overlay" id="modal-overlay" onclick="if(event.target===this)cerrarModal()">
  <div class="modal" id="modal">
    <div class="modal-hdr">
      <div>
        <div class="modal-title" id="m-title">Detalle del caso</div>
        <div class="modal-ticket" id="m-ticket"></div>
      </div>
      <button class="btn-close" onclick="cerrarModal()">×</button>
    </div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-links" id="m-links"></div>
  </div>
</div>

<script>
const BASE_URL = 'https://snazzy-starship-8e4240.netlify.app';
let PIN = '';
let todosLosCasos = [];
let casosFiltrados = [];

// ── LOGIN ──────────────────────────────────────────────────────────────────
async function login() {
  const pin = document.getElementById('pin-input').value.trim();
  if (!pin) return;
  document.getElementById('login-error').textContent = '';

  // Verificar PIN llamando a la función
  try {
    const resp = await fetch(`/.netlify/functions/listar-casos?pin=${encodeURIComponent(pin)}`);
    if (resp.status === 401) {
      document.getElementById('login-error').textContent = 'PIN incorrecto. Inténtalo de nuevo.';
      document.getElementById('pin-input').value = '';
      return;
    }
    const data = await resp.json();
    PIN = pin;
    todosLosCasos = data.casos || [];
    casosFiltrados = todosLosCasos;
    mostrarDashboard();
  } catch(e) {
    // MODO DEMO — sin conexión a Netlify
    PIN = pin;
    todosLosCasos = datosDemo();
    casosFiltrados = todosLosCasos;
    mostrarDashboard();
  }
}

function mostrarDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display  = 'block';
  document.getElementById('live-ind').style.display     = 'flex';
  document.getElementById('btn-ref').style.display      = 'block';
  renderTabla();
  renderKPIs();
}

// ── CARGA / REFRESH ────────────────────────────────────────────────────────
async function cargarDatos() {
  document.getElementById('btn-ref').textContent = '…';
  try {
    const estado  = document.getElementById('f-estado').value;
    const cliente = document.getElementById('f-cliente').value;
    const desde   = document.getElementById('f-desde').value;
    const hasta   = document.getElementById('f-hasta').value;

    let url = `/.netlify/functions/listar-casos?pin=${encodeURIComponent(PIN)}`;
    if (estado && estado !== 'todos') url += `&estado=${encodeURIComponent(estado)}`;
    if (cliente) url += `&cliente=${encodeURIComponent(cliente)}`;
    if (desde)   url += `&desde=${encodeURIComponent(desde)}`;
    if (hasta)   url += `&hasta=${encodeURIComponent(hasta)}`;

    const resp = await fetch(url);
    const data = await resp.json();
    todosLosCasos  = data.casos || [];
    casosFiltrados = todosLosCasos;
  } catch(e) {
    todosLosCasos  = datosDemo();
    casosFiltrados = todosLosCasos;
  }
  renderTabla();
  renderKPIs();
  document.getElementById('btn-ref').textContent = '↻ Actualizar';
  document.getElementById('last-update').textContent =
    'Actualizado: ' + new Date().toLocaleString('es-CL');
}

// ── FILTROS ────────────────────────────────────────────────────────────────
function aplicarFiltros() {
  const estado  = document.getElementById('f-estado').value;
  const cliente = document.getElementById('f-cliente').value.toLowerCase();
  const desde   = document.getElementById('f-desde').value;
  const hasta   = document.getElementById('f-hasta').value;

  casosFiltrados = todosLosCasos.filter(c => {
    if (estado !== 'todos' && c.estado !== estado) return false;
    if (cliente && !(c.cliente||'').toLowerCase().includes(cliente)) return false;
    if (desde && c.apertura && c.apertura < desde) return false;
    if (hasta && c.apertura && c.apertura > hasta + 'T23:59') return false;
    return true;
  });
  renderTabla();
  renderKPIs();
}

function limpiarFiltros() {
  document.getElementById('f-estado').value  = 'todos';
  document.getElementById('f-cliente').value = '';
  document.getElementById('f-desde').value   = '';
  document.getElementById('f-hasta').value   = '';
  casosFiltrados = todosLosCasos;
  renderTabla();
  renderKPIs();
}

// ── RENDER KPIs ────────────────────────────────────────────────────────────
function renderKPIs() {
  const cs = casosFiltrados;
  document.getElementById('k-total').textContent    = cs.length;
  document.getElementById('k-terreno').textContent  = cs.filter(c=>c.estado==='En terreno').length;
  document.getElementById('k-pendiente').textContent= cs.filter(c=>c.estado==='Pendiente aprobación').length;
  document.getElementById('k-cerrado').textContent  = cs.filter(c=>c.estado==='Cerrado').length;

  const conHH = cs.filter(c => c.hhTotal && !isNaN(parseFloat(c.hhTotal)));
  if (conHH.length) {
    const prom = conHH.reduce((a,c) => a + parseFloat(c.hhTotal), 0) / conHH.length;
    document.getElementById('k-hh').textContent = prom.toFixed(1) + 'h';
  } else {
    document.getElementById('k-hh').textContent = '—';
  }
}

// ── RENDER TABLA ───────────────────────────────────────────────────────────
function renderTabla() {
  const tbody = document.getElementById('tabla-body');
  document.getElementById('n-resultados').textContent =
    casosFiltrados.length + ' caso' + (casosFiltrados.length !== 1 ? 's' : '');

  if (!casosFiltrados.length) {
    tbody.innerHTML = `<tr><td colspan="10" class="estado-tabla">No hay casos con los filtros actuales.</td></tr>`;
    return;
  }

  tbody.innerHTML = casosFiltrados.map(c => {
    const badgeEstado = badgeE(c.estado);
    const badgeGar    = badgeG(c.garantia);
    const fecha       = c.apertura ? new Date(c.apertura).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
    const hh          = c.hhTotal ? parseFloat(c.hhTotal).toFixed(1)+'h' : '—';

    const linkT = c.tokenCaso
      ? `${BASE_URL}/terreno.html?ticket=${enc(c.ticket)}&token=${enc(c.tokenCaso)}`
      : `${BASE_URL}/terreno.html`;
    const linkA = c.tokenCaso
      ? `${BASE_URL}/aprobacion.html?ticket=${enc(c.ticket)}&token=${enc(c.tokenCaso)}`
      : `${BASE_URL}/aprobacion.html`;
    const linkR = c.tokenCaso
      ? `${BASE_URL}/reporte.html?ticket=${enc(c.ticket)}&token=${enc(c.tokenCaso)}`
      : `${BASE_URL}/reporte.html`;

    return `<tr onclick="abrirModal(${JSON.stringify(c).replace(/"/g,'&quot;')})" style="cursor:pointer">
      <td class="td-ticket">${c.ticket||'—'}</td>
      <td>${badgeEstado}</td>
      <td class="td-cliente">${c.cliente||'—'}</td>
      <td class="td-terminal">${c.terminal||'—'}</td>
      <td class="td-falla" title="${c.falla||''}">${c.falla||'—'}</td>
      <td>${badgeGar}</td>
      <td style="color:var(--muted);font-size:12px">${c.tecnico||'—'}</td>
      <td class="td-fecha">${fecha}</td>
      <td class="td-hh">${hh}</td>
      <td class="td-acciones" onclick="event.stopPropagation()">
        <a href="${linkT}" target="_blank" class="btn-accion btn-terreno">Terreno</a>
        <a href="${linkA}" target="_blank" class="btn-accion btn-aprobacion">Aprob.</a>
        <a href="${linkR}" target="_blank" class="btn-accion btn-reporte">Reporte</a>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('last-update').textContent =
    'Actualizado: ' + new Date().toLocaleString('es-CL');
}

function enc(v){ return encodeURIComponent(v||'') }

function badgeE(e) {
  const m = {
    'Abierto':               'badge-abierto',
    'En terreno':            'badge-terreno',
    'Pendiente aprobación':  'badge-pendiente',
    'Cerrado':               'badge-cerrado',
    'Cancelado':             'badge-cancelado',
  };
  const cls = m[e] || 'badge-abierto';
  return `<span class="badge ${cls}">${e||'—'}</span>`;
}

function badgeG(g) {
  if (!g) return '<span style="color:var(--faint);font-size:12px">—</span>';
  if (g.includes('VIGENTE'))  return `<span class="badge badge-gar-vigente" style="font-size:10px">Vigente</span>`;
  if (g.includes('FUERA'))    return `<span class="badge badge-gar-fuera" style="font-size:10px">Fuera</span>`;
  if (g.includes('SINIESTRO'))return `<span class="badge badge-gar-sin" style="font-size:10px">Siniestro</span>`;
  return `<span style="color:var(--muted);font-size:11px">${g}</span>`;
}

// ── MODAL DETALLE ──────────────────────────────────────────────────────────
function abrirModal(c) {
  document.getElementById('m-title').textContent  = c.cliente || 'Detalle del caso';
  document.getElementById('m-ticket').textContent = c.ticket || '';

  const fecha = c.apertura
    ? new Date(c.apertura).toLocaleString('es-CL', {dateStyle:'long',timeStyle:'short'})
    : '—';

  document.getElementById('m-body').innerHTML = [
    ['Estado',    badgeE(c.estado)],
    ['Garantía',  badgeG(c.garantia)],
    ['Terminal',  c.terminal||'—'],
    ['Falla',     c.falla||'—'],
    ['Técnico',   c.tecnico||'—'],
    ['Apertura',  fecha],
    ['HH trabajadas', c.hhTotal ? parseFloat(c.hhTotal).toFixed(2)+'h' : '—'],
  ].map(([k,v]) => `<div class="mrow"><span class="mk">${k}</span><span class="mv">${v}</span></div>`).join('');

  const linkT = c.tokenCaso
    ? `${BASE_URL}/terreno.html?ticket=${enc(c.ticket)}&token=${enc(c.tokenCaso)}`
    : `${BASE_URL}/terreno.html`;
  const linkA = c.tokenCaso
    ? `${BASE_URL}/aprobacion.html?ticket=${enc(c.ticket)}&token=${enc(c.tokenCaso)}`
    : `${BASE_URL}/aprobacion.html`;
  const linkR = c.tokenCaso
    ? `${BASE_URL}/reporte.html?ticket=${enc(c.ticket)}&token=${enc(c.tokenCaso)}`
    : `${BASE_URL}/reporte.html`;

  document.getElementById('m-links').innerHTML = `
    <a href="${linkT}" target="_blank" class="btn-modal bm-terreno">📋 Formulario terreno</a>
    <a href="${linkA}" target="_blank" class="btn-modal bm-aprobacion">✍️ Aprobación</a>
    <a href="${linkR}" target="_blank" class="btn-modal bm-reporte">📄 Reporte PDF</a>
  `;

  document.getElementById('modal-overlay').classList.add('show');
}

function cerrarModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

document.addEventListener('keydown', e => { if(e.key==='Escape') cerrarModal(); });
